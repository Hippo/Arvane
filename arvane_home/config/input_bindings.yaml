bindings:
  DropItem:
    - device: keyboard
      key: Q
  Hotbar1:
    - device: keyboard
      key: 1
  Hotbar2:
    - device: keyboard
      key: 2
  Hotbar3:
    - device: keyboard
      key: 3
  Hotbar4:
    - device: keyboard
      key: 4
  Hotbar5:
    - device: keyboard
      key: 5
  Hotbar6:
    - device: keyboard
      key: 6
  Hotbar7:
    - device: keyboard
      key: 7
  Hotbar8:
    - device: keyboard
      key: 8
  Hotbar9:
    - device: keyboard
      key: 9
  Jump:
    - device: keyboard
      key: Space
  Mount:
    - device: keyboard
      key: F
  MoveBackward:
    - device: keyboard
      key: S
  MoveForward:
    - device: keyboard
      key: W
  MoveLeft:
    - device: keyboard
      key: A
  MoveRight:
    - device: keyboard
      key: D
  NextHotbarSlot:
    - device: mouse_wheel
      direction: Up
  OpenChat:
    - device: keyboard
      key: T
  OpenInventory:
    - device: keyboard
      key: E
  PrevHotbarSlot:
    - device: mouse_wheel
      direction: Down
  PrimaryInteract:
    - button: Left
      device: mouse_button
  SecondaryInteract:
    - button: Right
      device: mouse_button
  ShowTabMenu:
    - device: keyboard
      key: Tab
  Sneak:
    - device: keyboard
      key: LCtrl
  Sprint:
    - device: keyboard
      key: LShift
  ToggleDebugMenu:
    - device: keyboard
      key: Grave
  TogglePauseMenu:
    - device: keyboard
      key: Escape
  VehicleRollLeft:
    - device: keyboard
      key: X
  VehicleRollRight:
    - device: keyboard
      key: C
version: 1

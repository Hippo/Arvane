chunk_pipeline:
  frame_spike_log_ms: 10
  max_client_chunk_applies_per_frame: 6
  max_client_chunk_unloads_per_frame: 32
  max_mesh_jobs_per_frame: 13
  max_mesh_sections_per_job: 4
  max_mesh_sections_prepared_per_frame: 8
  max_ready_chunks_sent_per_frame: 9
  profile_log_interval_ms: 0
chunks:
  load_distance: 10
  render_distance: 6
  simulation_distance: 2
  stream_distance: 9
language:
  locale: en_US
multiplayer:
  connection_timeout_seconds: 10
  keep_alive:
    server_timeout_seconds: 30
paths:
  input_bindings_file: arvane_home/config/input_bindings.yaml
  server_list_file: arvane_home/config/server_list.json
physics:
  mouse_sensitivity_radians: 0.0025
render:
  atlases:
    blocks:
      max_pages: 8
      page_size: 4096
    entities:
      max_pages: 8
      page_size: 2048
    fonts:
      max_pages: 4
      page_size: 2048
    particles:
      max_pages: 4
      page_size: 2048
    player_skins:
      cleanup:
        evict_after_unused_seconds: 300
        interval_seconds: 60
      max_pages: 8
      page_size: 2048
      pressure_cleanup:
        enabled: true
        target_usage: 0.65
        usage_threshold: 0.85
    ui:
      max_pages: 4
      page_size: 2048
  block_outline:
    color: "#050505"
    thickness: 0.55
  frame_pacing_enabled: false
  frame_pacing_spin_us: 500
  frame_pacing_target_fps: 120
  max_chunk_mesh_uploads_per_frame: 8
  shadows:
    enabled: true
  show_local_player_body: true
  sky:
    cirrus_amount: 0.45
    cloud_intensity: 1.75
    cumulus_amount: 0.8
    star_intensity: 1.25
ui:
  chat:
    max_history_messages: 1000
    open_max_lines: 8
    passive_fade_seconds: 2
    passive_max_lines: 8
    passive_visible_seconds: 8
window:
  height: 720
  title: Arvane
  vsync: false
  width: 1280

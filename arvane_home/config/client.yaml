paths:
  input_bindings_file: arvane_home/config/input_bindings.yaml
  server_list_file: arvane_home/config/server_list.json
window:
  width: 1280
  height: 720
  title: Arvane
  vsync: false
chunks:
  render_distance: 2
  stream_distance: 2
multiplayer:
  keep_alive:
    server_timeout_seconds: 30
  connection_timeout_seconds: 10
render:
  max_chunk_mesh_uploads_per_frame: 8
  frame_pacing_enabled: false
  frame_pacing_target_fps: 120
  frame_pacing_spin_us: 500
  show_local_player_body: true
  block_outline:
    color: [0.02, 0.02, 0.02]
    thickness: 0.55
  sky:
    star_intensity: 1.25
    cloud_intensity: 1.25
    cirrus_amount: 0.45
    cumulus_amount: 0.80
  atlases:
    blocks:
      page_size: 4096
      max_pages: 8
    entities:
      page_size: 2048
      max_pages: 8
    ui:
      page_size: 2048
      max_pages: 4
    fonts:
      page_size: 2048
      max_pages: 4
    player_skins:
      page_size: 2048
      max_pages: 8
      cleanup:
        interval_seconds: 60
        evict_after_unused_seconds: 300
      pressure_cleanup:
        enabled: true
        usage_threshold: 0.85
        target_usage: 0.65
    particles:
      page_size: 2048
      max_pages: 4
chunk_pipeline:
  max_client_chunk_applies_per_frame: 2
  max_client_chunk_unloads_per_frame: 32
  max_mesh_jobs_per_frame: 4
  frame_spike_log_ms: 10
  profile_log_interval_ms: 0

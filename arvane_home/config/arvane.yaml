paths:
  arvane_home: arvane_home
simulation:
  base_tps: 60
  systems:
    physics:
      interval: 1
    entities:
      interval: 1
    ai:
      interval: 2
    block_updates:
      interval: 3
      budget: 5000
    fluids:
      interval: 1
      budget: 2000
    random_ticks:
      interval: 20
      samples_per_chunk: 3
  fluids:
    water:
      flow_interval_ticks: 10
    lava:
      flow_interval_ticks: 30
chunks:
  load_distance: 3
  simulation_distance: 1
  unload_margin: 1
jobs:
  worker_threads: 0
  reserved_threads: 2
  min_worker_threads: 1
  max_worker_threads: 64
physics:
  standing_eye_height: 1.62
  sneaking_eye_height: 1.35
  swimming_eye_height: 0.45
  eye_height_lerp_per_second: 12.0
  reach_distance: 5.0
  mouse_sensitivity_radians: 0.0025
  walk_speed: 4.5
  sprint_speed: 6.0
  sneak_speed: 2.25
  air_speed: 3.5
  air_control_acceleration_per_second: 10.0
  fly_speed: 8.0
  fly_vertical_speed: 6.0
  jump_velocity: 8.5
  gravity_per_second: 32.0
  terminal_velocity: 55.0
  body_width: 0.6
  body_height: 1.8
  sneaking_body_height: 1.5
  swimming_body_width: 0.9
  swimming_body_height: 0.6
  step_height: 0.6
  sneak_support_probe_depth: 0.05
  collision_epsilon: 0.001
  surface_swim_speed: 2.5
  underwater_swim_speed: 2.0
  fast_surface_swim_speed: 5.6
  fast_underwater_swim_speed: 5.0
  upward_swim_acceleration: 18.0
  downward_swim_acceleration: 18.0
  liquid_drag: 0.8
  surface_float_depth: 1.0
  surface_buoyancy: 10.0
  underwater_buoyancy: 1.0
  breath_seconds: 15.0
  max_head_body_yaw_radians: 1.309
gameplay:
  block_breaking:
    base_seconds_per_hardness: 1.0
    creative_inventory_multiplier: 0.0
    hand_speed_multiplier: 0.2
    wrong_tool_speed_multiplier: 0.2
  dropped_items:
    pickup_radius: 1.25
    pickup_delay_seconds: 0.5
  combat:
    default_attack_damage: 1.0
    default_attack_range: 3.0
    default_attack_cooldown_seconds: 0.35
    attack_validation_grace_blocks: 3.0
    max_attack_validation_range: 6.0
    existing_horizontal_retention: 0.45
    base_horizontal_knockback: 8.0
    sprint_horizontal_bonus: 3.0
    base_vertical_knockback: 7.0
    airborne_vertical_knockback: 5.0
    vertical_knockback_cap: 9.0
    knockback_control_suppression_ticks: 2
    use_current_block_obstruction_check: false
chunk_pipeline:
  max_generation_jobs_per_frame: 4
  max_generation_results_per_tick: 2
  max_lighting_results_per_tick: 1

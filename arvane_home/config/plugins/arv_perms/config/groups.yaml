schema_version: 1
data:
  groups:
    - core: ~
      id: admin
      inherits:
        - player
      permissions:
        - node: "*"
          value: ALLOW
      priority: 1000
    - core:
        - name: can_interact
          value: ALLOW
        - name: can_open_inventory
          value: ALLOW
      id: player
      inherits: ~
      permissions:
        - node: arvane.chat.send
          value: ALLOW
        - node: arvane.command.help
          value: ALLOW
        - node: arvane.command.msg
          value: ALLOW
      priority: 0

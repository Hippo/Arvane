id: arvane:worldgen/biome/scrubland
version: 1
display_name: Scrubland

tags:
  - arvane:biome/land
  - arvane:biome/hot
  - arvane:biome/dry
  - arvane:biome/grassy

terrain:
  base_height_offset: 1
  height_scale_multiplier: 0.4
  hill_multiplier: 0.68
  ridge_multiplier: 0.08
  roughness_multiplier: 0.45

surface_rule_set: arvane:worldgen/surface_rule_set/grassy_land

spawns:
  passive:
    - entity: arvane:pig
      weight: 3
      min_group: 1
      max_group: 3
      conditions:
        surface: true
        block_tags_below:
          - arvane:spawn/grass_like
    - entity: arvane:horse
      weight: 4
      min_group: 1
      max_group: 2
      conditions:
        surface: true
        block_tags_below:
          - arvane:spawn/grass_like

features:
  stages:
    surface_decoration:
      - arvane:worldgen/placed_feature/grass_patch
      - arvane:worldgen/placed_feature/sand_disk_sparse

colors:
  grass: "#8FAE4C"
  foliage: "#6F8F3D"
  water: "#3F76E4"
  fog: "#DDD5A8"

id: arvane:worldgen/biome/scrubland
version: 1
display_name: Scrubland

tags:
  - arvane:biome/land
  - arvane:biome/hot
  - arvane:biome/dry
  - arvane:biome/grassy

terrain:
  base_height_offset: 1
  height_scale_multiplier: 0.4
  hill_multiplier: 0.68
  ridge_multiplier: 0.08
  roughness_multiplier: 0.45

surface_rule_set: arvane:worldgen/surface_rule_set/grassy_land

spawns:
  passive:
    use:
      - table: arvane:worldgen/spawn_table/temperate_passive
        weight_scale: 1.0
    rate_scale: 0.28
    density_cap_scale: 0.45
    remove: []
    overrides:
      arvane:pig_grass:
        weight: 1
      arvane:horse_grass:
        weight: 2
    add: []

features:
  stages:
    surface_decoration:
      - arvane:worldgen/placed_feature/grass_patch
      - arvane:worldgen/placed_feature/sand_disk_sparse

colors:
  grass: "#8FAE4C"
  foliage: "#6F8F3D"
  water: "#3F76E4"
  fog: "#DDD5A8"

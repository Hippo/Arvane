id: arvane:worldgen/biome/mountains
version: 1
display_name: Mountains

tags:
  - arvane:biome/land
  - arvane:biome/temperate
  - arvane:biome/grassy
  - arvane:biome/mountain

terrain:
  base_height_offset: 30
  height_scale_multiplier: 0.95
  hill_multiplier: 1.25
  ridge_multiplier: 1.75
  roughness_multiplier: 1.35
  terrace_step: 5
  terrace_strength: 0.22

surface_rule_set: arvane:worldgen/surface_rule_set/mountain

spawns:
  passive:
    use:
      - table: arvane:worldgen/spawn_table/temperate_passive
        weight_scale: 1.0
    rate_scale: 0.25
    density_cap_scale: 0.4
    remove: []
    overrides:
      arvane:pig_grass:
        weight: 1
      arvane:horse_grass:
        weight: 1
    add: []

features:
  stages:
    surface_decoration:
      - arvane:worldgen/placed_feature/grass_patch
      - arvane:worldgen/placed_feature/stone_boulder_sparse

colors:
  grass: "#6A8F45"
  foliage: "#4D7338"
  water: "#3F76E4"
  fog: "#D4DDE8"

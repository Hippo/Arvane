id: arvane:worldgen/biome/forest
version: 1
display_name: Forest

tags:
  - arvane:biome/land
  - arvane:biome/temperate
  - arvane:biome/wet
  - arvane:biome/grassy
  - arvane:biome/forested

terrain:
  base_height_offset: 1
  height_scale_multiplier: 0.55
  hill_multiplier: 0.85
  ridge_multiplier: 0.12
  roughness_multiplier: 0.75

surface_rule_set: arvane:worldgen/surface_rule_set/grassy_land

spawns:
  passive:
    - entity: arvane:pig
      weight: 14
      min_group: 3
      max_group: 5
      conditions:
        surface: true
        block_tags_below:
          - arvane:spawn/grass_like

features:
  stages:
    surface_decoration:
      - arvane:worldgen/placed_feature/oak_tree_dense
      - arvane:worldgen/placed_feature/grass_patch
      - arvane:worldgen/placed_feature/stone_boulder_sparse

colors:
  grass: "#5F9F3C"
  foliage: "#3F7D32"
  water: "#3F76E4"
  fog: "#C8D8FF"

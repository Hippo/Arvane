id: arvane:worldgen/biome/plains
version: 1
display_name: Plains

tags:
  - arvane:biome/land
  - arvane:biome/temperate
  - arvane:biome/grassy

terrain:
  base_height_offset: 0
  height_scale_multiplier: 0.45
  hill_multiplier: 0.55
  ridge_multiplier: 0.05
  roughness_multiplier: 0.35

surface_rule_set: arvane:worldgen/surface_rule_set/grassy_land

spawns:
  passive:
    use:
      - table: arvane:worldgen/spawn_table/temperate_passive
        weight_scale: 1.0
    budget_profile: arvane:worldgen/spawn_budget_profile/passive_conservative
    density_multiplier: 1.0
    soft_cap_multiplier: 1.0
    remove: []
    overrides:
      arvane:horse_grass:
        weight: 2
    add: []

features:
  stages:
    surface_decoration:
      - arvane:worldgen/placed_feature/grass_patch
      - arvane:worldgen/placed_feature/oak_tree_sparse

colors:
  grass: "#6BAA45"
  foliage: "#4F8A38"
  water: "#3F76E4"
  fog: "#C8D8FF"

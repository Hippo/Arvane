id: arvane:worldgen/surface_rule_set/highlands
version: 1

rules:
  - when:
      slope_greater_than: 0.28
    layers:
      - block: arvane:stone
        depth: remaining

  - when:
      height_above: 70
    layers:
      - block: arvane:stone
        depth: 2
      - block: arvane:dirt
        depth: 1
      - block: arvane:stone
        depth: remaining

  - layers:
      - block: arvane:grass_block
        depth: 1
      - block: arvane:dirt
        depth: 2
      - block: arvane:stone
        depth: remaining

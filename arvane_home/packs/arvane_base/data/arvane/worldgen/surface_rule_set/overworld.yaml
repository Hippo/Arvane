id: arvane:worldgen/surface_rule_set/overworld
version: 1

rules:
  - when:
      biome_tag: arvane:biome/ocean
    layers:
      - block: arvane:sand
        depth: 2
      - block: arvane:dirt
        depth: 2
      - block: arvane:stone
        depth: remaining

  - when:
      biome_tag: arvane:biome/sandy
    layers:
      - block: arvane:sand
        depth: 4
      - block: arvane:stone
        depth: remaining

  - when:
      biome_tag: arvane:biome/mountain
      slope_greater_than: 0.75
    layers:
      - block: arvane:stone
        depth: remaining

  - layers:
      - block: arvane:grass_block
        depth: 1
      - block: arvane:dirt
        depth: 3
      - block: arvane:stone
        depth: remaining

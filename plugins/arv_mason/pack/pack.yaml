schema_version: 1

id: "arv_mason"
display_name: "Mason"
version: "0.1.0"
description: "First-party Arvane world editing tools."

authors:
  - "Arvane"

namespaces:
  - "arv_mason"

side: "server"

engine:
  min_version: "0.1.0"

dependencies:
  - id: "arvane_base"
    version: ">=0.1.0"

capabilities:
  assets: true
  data: true
  config: true
  native_plugin: true

commands:
  - alias: mmarker
    command: mason.marker
    visible_in_help: true
  - alias: mm
    command: mason.marker
    visible_in_help: true
  - alias: mset
    command: mason.set
    visible_in_help: true
  - alias: mreplace
    command: mason.replace
    visible_in_help: true
  - alias: mcopy
    command: mason.copy
    visible_in_help: true
  - alias: mpaste
    command: mason.paste
    visible_in_help: true
  - alias: mundo
    command: mason.undo
    visible_in_help: true
  - alias: mredo
    command: mason.redo
    visible_in_help: true

permissions:
  - id: mason.command.use
    description: Use Mason commands.
    default: unset
  - id: mason.command.marker
    description: Receive Mason marker items.
    default: unset
  - id: mason.command.set
    description: Fill Mason selections.
    default: unset
  - id: mason.command.replace
    description: Replace blocks in Mason selections.
    default: unset
  - id: mason.command.copy
    description: Copy Mason selections.
    default: unset
  - id: mason.command.paste
    description: Paste Mason clipboards.
    default: unset
  - id: mason.command.undo
    description: Undo Mason edits.
    default: unset
  - id: mason.command.redo
    description: Redo Mason edits.
    default: unset
  - id: mason.limit.bypass
    description: Bypass Mason operation limits.
    default: unset
  - id: mason.region.bypass
    description: Bypass region restrictions when server policy allows it.
    default: unset

native:
  api_version: 1
  entrypoint: "arvane_plugin_main"
  libraries:
    linux-x86_64: "native/linux-x86_64/libarv_mason.so"
    windows-x86_64: "native/windows-x86_64/arv_mason.dll"
    macos-arm64: "native/macos-arm64/libarv_mason.dylib"
    macos-x86_64: "native/macos-x86_64/libarv_mason.dylib"
